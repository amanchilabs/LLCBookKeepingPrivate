name: Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: bash -n scripts/build-ios-simulator.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      - run: npm audit --audit-level=low
      - run: npm run check:toolchain
      - name: Generate native configuration
        run: npx expo prebuild --no-install
      - name: Bundle native JavaScript
        run: |
          for platform in ios android; do
            npx expo export --platform "$platform" --max-workers 2 --output-dir "/tmp/llc-export-$platform" || exit
          done
