<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 844' width='390' height='844' role='img' aria-label='PROPOSED synthetic RP-04 Trial balance export tab'><style>text{font-family:-apple-system,Roboto,sans-serif;font-size:14px;fill:#14215A}.w{fill:#fff}.b{font-weight:700}.m{fill:#4A5578}.g{fill:#0E6B35}.r{fill:#B42318}.a{fill:#8A5A00}.e{text-anchor:end}.c{text-anchor:middle}.x{font-size:22px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:13px}</style><rect width='390' height='844' fill='#fff'/><rect width='390' height='92' fill='#0E6B35'/><text x='20' y='54' class='w l'>LLCBookKeepingPrivate</text><text x='20' y='76' class='w s'>Northwind Sample LLC</text><circle cx='348' cy='58' r='9' fill='none' stroke='#fff' stroke-width='2.5'/><path d='M355 65l7 7' stroke='#fff' stroke-width='2.5'/><rect y='92' width='390' height='24' fill='#FFF4DC'/><text x='195' y='109' class='a s c'>PROPOSED · synthetic data · not implemented</text><text x='20' y='144' class='g b'>‹ Reports</text><text x='20' y='174' class='x'>Trial balance</text><rect x='16' y='188' width='358' height='48' rx='24' fill='#fff' stroke='#CFE8D4'/><rect x='255' y='188' width='119' height='48' rx='24' fill='#0E6B35'/><text x='76' y='217' class='c'>Overview</text><text x='195' y='217' class='c'>Accounts</text><text x='314' y='217' class='w b c'>Export</text><rect x='16' y='252' width='358' height='152' rx='14' fill='#fff' stroke='#CFE8D4'/><text x='32' y='280' class='l'>Export scope</text><text x='32' y='310' class='m s'>As of</text><text x='358' y='310' class='e s'>2026-10-31</text><text x='32' y='336' class='m s'>Accounts</text><text x='358' y='336' class='e s'>All accounts, unfiltered</text><text x='32' y='362' class='m s'>Columns</text><text x='358' y='362' class='e s'>Account, type, debit, credit</text><text x='32' y='388' class='m s'>Totals row</text><text x='358' y='388' class='e s'>Total debits and credits</text><rect x='16' y='420' width='358' height='48' rx='12' fill='#0E6B35'/><text x='195' y='449' class='w b c'>Export CSV</text><rect x='16' y='478' width='358' height='48' rx='12' fill='#fff' stroke='#0E6B35' stroke-width='2'/><text x='195' y='507' class='g b c'>Export PDF</text><rect x='16' y='542' width='358' height='96' rx='14' fill='#EEF2FA'/><text x='32' y='566' class='s'>The PDF holds the same rows as the CSV.</text><text x='32' y='584' class='s'>Account codes aren’t in the file today;</text><text x='32' y='602' class='s'>adding them is a proposed change. Search and</text><text x='32' y='620' class='s'>type filters don’t narrow the export.</text><text x='20' y='668' class='m s'>Files are made on this device. Nothing is sent</text><text x='20' y='686' class='m s'>until you pick a destination in the share sheet.</text><rect y='776' width='390' height='68' fill='#fff' stroke='#CFE8D4'/><rect x='235' y='784' width='76' height='40' rx='14' fill='#EAF6EC'/><text y='809' class='s c'><tspan x='39'>Dashboard</tspan><tspan x='117'>Transactions</tspan><tspan x='195'>Members</tspan><tspan x='273' class='g b'>Reports</tspan><tspan x='351'>More</tspan></text></svg>
