<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 844' role='img' aria-label='PROPOSED synthetic BOOT-03 Storage and recovery tools'><style>text{font-family:-apple-system,Roboto,sans-serif;font-size:14px;fill:#14215A}.w{fill:#fff}.b{font-weight:700}.m{fill:#4A5578}.g{fill:#0E6B35}.r{fill:#B42318}.a{fill:#8A5A00}.e{text-anchor:end}.c{text-anchor:middle}.x{font-size:24px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:13px}</style><rect width='390' height='844' fill='#fff'/><rect width='390' height='92' fill='#0E6B35'/><text x='20' y='54' class='w l'>LLCBookKeepingPrivate</text><text x='20' y='76' class='w s'>Northwind Sample LLC</text><rect y='92' width='390' height='24' fill='#FFF4DC'/><text x='195' y='109' class='a s c'>PROPOSED · synthetic data · not implemented</text><text x='20' y='144' class='g b'>‹ Return to books</text><text x='20' y='176' class='x'>Storage and recovery</text><rect x='16' y='188' width='216' height='26' rx='13' fill='#FFF4DC'/><text x='124' y='206' class='a s b c'>Development tools · synthetic data</text><rect x='16' y='226' width='358' height='206' rx='14' fill='#EAF6EC'/><text x='32' y='254' class='l'>Encrypted backup file</text><text x='32' y='276' class='s'>Creates a passphrase-protected file of this</text><text x='32' y='294' class='s'>LLC’s books. You choose where it goes.</text><text x='32' y='322' class='s b'>Passphrase</text><rect x='32' y='330' width='326' height='44' rx='10' fill='#fff' stroke='#CFE8D4'/><text x='46' y='357'>••••••••••••</text><rect x='32' y='382' width='326' height='40' rx='10' fill='#0E6B35'/><text x='195' y='407' class='w b c'>Create encrypted backup</text><rect x='16' y='444' width='358' height='140' rx='14' fill='#fff' stroke='#CFE8D4'/><text x='32' y='472' class='l'>Restore from a backup file</text><text x='32' y='496' class='s'>Replaces this LLC’s local books only after the</text><text x='32' y='514' class='s'>file and passphrase check out.</text><rect x='32' y='530' width='326' height='40' rx='10' fill='#fff' stroke='#0E6B35'/><text x='195' y='555' class='g b c'>Choose backup file</text><rect x='16' y='596' width='358' height='56' rx='14' fill='#fff' stroke='#CFE8D4'/><text x='32' y='629' class='b'>Storage checks</text><text x='358' y='629' class='m l e'>▾</text><rect x='16' y='666' width='358' height='78' rx='14' fill='#EEF2FA'/><text x='32' y='692' class='s'>There’s no recovery server or key escrow. Without</text><text x='32' y='710' class='s'>this device’s key or a backup and its passphrase,</text><text x='32' y='728' class='s'>encrypted books can’t be recovered.</text></svg>
