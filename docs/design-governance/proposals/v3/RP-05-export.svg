s='e s'>debit, credit, running balance</text><text x='32' y='432' class='m s'>Totals row</text><text x='358' y='432' class='e s'>Debits, credits, ending</text><rect x='16' y='460' width='358' height='48' rx='12' fill='#0E6B35'/><text x='195' y='489' class='w b c'>Export CSV</text><rect x='16' y='518' width='358' height='48' rx='12' fill='#fff' stroke='#0E6B35' stroke-width='2'/><text x='195' y='547' class='g b c'>Export PDF</text><rect x='16' y='584' width='358' height='96' rx='14' fill='#EEF2FA'/><text x='32' y='608' class='s'>Each file covers one account, cumulative</text><text x='32' y='626' class='s'>through the date. A from-date or all-accounts</text><text x='32' y='644' class='s'>export is a proposed change. The PDF holds</text><text x='32' y='662' class='s'>the same rows as the CSV.</text><text x='20' y='708' class='m s'>Files are made on this device. Nothing is sent</text><text x='20' y='726' class='m s'>until you pick a destination in the share sheet.</text><rect y='776' width='390' height='68' fill='#fff' stroke='#CFE8D4'/><rect x='235' y='784' width='76' height='40' rx='14' fill='#EAF6EC'/><text y='809' class='s c'><tspan x='39'>Dashboard</tspan><tspan x='117'>Transactions</tspan><tspan x='195'>Members</tspan><tspan x='273' class='g b'>Reports</tspan><tspan x='351'>More</tspan></text></svg>
