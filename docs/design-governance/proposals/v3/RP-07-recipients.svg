ayments</text><text x='358' y='414' class='e'>$0.00</text><rect x='16' y='440' width='358' height='128' rx='14' fill='#fff' stroke='#CFE8D4'/><text x='32' y='468' class='l'>Blake Sample</text><text x='358' y='468' class='e l'>$3,000.00</text><text x='32' y='500'>Guaranteed payments, services</text><text x='358' y='500' class='e'>$3,000.00</text><text x='32' y='526'>Guaranteed payments, capital use</text><text x='358' y='526' class='e'>$0.00</text><text x='32' y='552'>Member distributions</text><text x='358' y='552' class='e'>$0.00</text><rect x='16' y='580' width='358' height='52' rx='14' fill='#EAF6EC' stroke='#0E6B35'/><text x='32' y='611' class='b s'>$3,880.00 + $3,000.00 = $6,880.00 total</text><text x='358' y='611' class='g b e'>✓</text><rect x='16' y='644' width='358' height='114' rx='14' fill='#EEF2FA'/><text x='32' y='666' class='s'>Guaranteed payments come from existing</text><text x='32' y='684' class='s'>records. Distributions and loan cash live in</text><text x='32' y='702' class='s'>their own reports today; combining them here</text><text x='32' y='720' class='s'>is proposed. Other payments need a definition</text><text x='32' y='738' class='s'>before they can appear.</text><rect y='776' width='390' height='68' fill='#fff' stroke='#CFE8D4'/><rect x='235' y='784' width='76' height='40' rx='14' fill='#EAF6EC'/><text y='809' class='s c'><tspan x='39'>Dashboard</tspan><tspan x='117'>Transactions</tspan><tspan x='195'>Members</tspan><tspan x='273' class='g b'>Reports</tspan><tspan x='351'>More</tspan></text></svg>
