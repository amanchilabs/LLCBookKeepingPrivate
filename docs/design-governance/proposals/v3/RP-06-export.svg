<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 844' width='390' height='844' role='img' aria-label='PROPOSED synthetic RP-06 Capital movement workpaper export tab'><style>text{font-family:-apple-system,Roboto,sans-serif;font-size:14px;fill:#14215A}.w{fill:#fff}.b{font-weight:700}.m{fill:#4A5578}.g{fill:#0E6B35}.r{fill:#B42318}.a{fill:#8A5A00}.e{text-anchor:end}.c{text-anchor:middle}.x{font-size:22px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:13px}</style><rect width='390' height='844' fill='#fff'/><rect width='390' height='92' fill='#0E6B35'/><text x='20' y='54' class='w l'>LLCBookKeepingPrivate</text><text x='20' y='76' class='w s'>Northwind Sample LLC</text><circle cx='348' cy='58' r='9' fill='none' stroke='#fff' stroke-width='2.5'/><path d='M355 65l7 7' stroke='#fff' stroke-width='2.5'/><rect y='92' width='390' height='24' fill='#FFF4DC'/><text x='195' y='109' class='a s c'>PROPOSED · synthetic data · not implemented</text><text x='20' y='144' class='g b'>‹ Reports</text><text x='20' y='174' class='x'>Capital movement workpaper</text><rect x='16' y='188' width='358' height='48' rx='24' fill='#fff' stroke='#CFE8D4'/><rect x='284' y='188' width='90' height='48' rx='24' fill='#0E6B35'/><text x='61' y='217' class='s c'>Overview</text><text x='151' y='217' class='s c'>By member</text><text x='240' y='217' class='s c'>Activity</text><text x='329' y='217' class='w b s c'>Export</text><rect x='16' y='252' width='358' height='176' rx='14' fill='#fff' stroke='#CFE8D4'/><text x='32' y='280' class='l'>Export scope</text><text x='32' y='310' class='m s'>Period</text><text x='358' y='310' class='e s'>2026-01-01 to 2026-10-31</text><text x='32' y='336' class='m s'>Members</text><text x='358' y='336' class='e s'>All members</text><text x='32' y='362' class='m s'>Rows</text><text x='358' y='362' class='e s'>3 activities + period totals</text><text x='32' y='388' class='m s'>Columns</text><text x='358' y='388' class='e s'>Member, activity, capital and</text><text x='358' y='406' class='e s'>cash movement, CPA review</text><rect x='16' y='444' width='358' height='48' rx='12' fill='#0E6B35'/><text x='195' y='473' class='w b c'>Export CSV</text><rect x='16' y='502' width='358' height='48' rx='12' fill='#fff' stroke='#0E6B35' stroke-width='2'/><text x='195' y='531' class='g b c'>Export PDF</text><rect x='16' y='566' width='358' height='64' rx='14' fill='#fff' stroke='#4A5578' stroke-dasharray='6 4'/><text x='32' y='592' class='m b'>Export one member only</text><text x='32' y='614' class='a s'>Not available. Needs separate authorization.</text><rect x='16' y='644' width='358' height='96' rx='14' fill='#EEF2FA'/><text x='32' y='668' class='s'>The file lists book capital and cash movement</text><text x='32' y='686' class='s'>per activity. It has no beginning or ending</text><text x='32' y='704' class='s'>capital and no tax-basis figures. The PDF holds</text><text x='32' y='722' class='s'>the same rows as the CSV.</text><rect y='776' width='390' height='68' fill='#fff' stroke='#CFE8D4'/><rect x='235' y='784' width='76' height='40' rx='14' fill='#EAF6EC'/><text y='809' class='s c'><tspan x='39'>Dashboard</tspan><tspan x='117'>Transactions</tspan><tspan x='195'>Members</tspan><tspan x='273' class='g b'>Reports</tspan><tspan x='351'>More</tspan></text></svg>
