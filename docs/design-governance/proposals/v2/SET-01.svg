<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844' viewBox='0 0 390 844' style='background:#F7F5F0'><style>svg{font-family:system-ui,sans-serif;font-size:13px;fill:#526174}.s{font-size:17px;font-weight:700;fill:#14243B}.r{font-size:14px;font-weight:600;fill:#14243B}.w{fill:#fff;font-size:15px;font-weight:700}.g{fill:#087A55;font-size:15px;font-weight:700}.n{font-size:12px}.m{text-anchor:middle}.c{fill:#fff;stroke:#D9E0DC}.b{fill:#fff;stroke:#087A55}</style><rect width='390' height='84' fill='#fff'/><text x='18' y='42' class='s'>LLCBookKeepingPrivate</text><text x='18' y='64'>Northstar Studio LLC</text><rect x='290' y='20' width='82' height='44' rx='12' class='b'/><text x='331' y='47' class='g m'>Search</text><g class='c'><rect x='18' y='100' width='354' height='300' rx='16'/><rect x='34' y='200' width='322' height='44' rx='12'/><rect x='34' y='278' width='322' height='44' rx='12'/><rect x='18' y='416' width='354' height='142' rx='16'/><rect x='18' y='574' width='354' height='150' rx='16'/></g><text x='34' y='132' class='s'>Bookkeeping periods</text><text x='34' y='160' class='r'>No periods are closed</text><text x='34' y='192' class='r'>Close books through</text><text x='34' y='270' class='r'>Reason for close or reopen</text><g opacity='.45'><rect x='34' y='336' width='322' height='48' rx='12' fill='#087A55'/><text x='195' y='366' class='w m'>Close books through date</text></g><text x='34' y='448' class='s'>Privacy</text><text x='34' y='472'>Bookkeeping records are kept in this app’s local</text><text x='34' y='490'>workspace. Mobile bookkeeping does not require</text><text x='34' y='508'>registration and does not automatically sync to a cloud</text><text x='34' y='526'>service or connect to a bank.</text><text x='34' y='606' class='s'>Development storage and</text><text x='34' y='628' class='s'>recovery tools</text><rect x='34' y='652' width='322' height='48' rx='12' class='b'/><text x='195' y='682' class='g m'>Open storage and recovery tools</text><r