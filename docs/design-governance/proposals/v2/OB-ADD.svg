<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844' viewBox='0 0 390 844' style='background:#F7F5F0'><style>svg{font-family:system-ui,sans-serif;font-size:13px;fill:#526174}.h{font-size:26px;font-weight:700;fill:#14243B}.s{font-size:17px;font-weight:700;fill:#14243B}.w{fill:#fff;font-size:15px;font-weight:700}.g{fill:#087A55;font-size:15px;font-weight:700}.y{fill:#087A55;font-weight:700}.n{font-size:12px}.m{text-anchor:middle}.c{fill:#fff;stroke:#D9E0DC}</style><rect width='390' height='64' fill='#fff'/><text x='18' y='40' class='s'>Add an LLC workspace</text><rect x='290' y='10' width='82' height='44' rx='12' class='c'/><text x='331' y='37' class='g m'>Cancel</text><rect x='18' y='84' width='354' height='292' rx='16' fill='#FFFDF8' stroke='#D9E0DC'/><rect x='34' y='102' width='88' height='26' rx='13' fill='#E7F3EC'/><text x='78' y='120' class='y m'>On device</text><text x='34' y='166' class='h'>Your LLC books,</text><text x='34' y='198' class='h'>kept private.</text><text x='34' y='226'>Set up your business once, then keep its</text><text x='34' y='244'>bookkeeping close at hand.</text><text x='34' y='272' class='n'>No mandatory account, automatic cloud sync, or bank</text><text x='34' y='288' class='n'>connection. You choose when to export or back up a copy.</text><rect x='34' y='308' width='322' height='48' rx='12' fill='#087A55'/><text x='195' y='338' class='w m'>Get started</text><rect x='18' y='392' width='354' height='152' rx='16' class='c'/><text x='34' y='424' class='s'>What you’ll set up</text><text x='34' y='452'>Business details, member ownership interests,</text><text x='34' y='470'>and an optional first bank or cash account.</text><text x='34' y='498'>Ownership is recorded separately from income,</text><text x='34' y='516'>profit, capital, payments, and loans.</text></svg>
