<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844' viewBox='0 0 390 844' style='background:#F7F5F0'><style>svg{font-family:system-ui,sans-serif;font-size:13px;fill:#526174}.h{font-size:26px;font-weight:700;fill:#14243B}.s{font-size:17px;font-weight:700;fill:#14243B}.n{font-size:12px}.y{fill:#087A55;font-weight:700}.m{text-anchor:middle}.c{fill:#fff;stroke:#D9E0DC}</style><rect width='390' height='68' fill='#fff'/><text x='18' y='42' class='s'>Storage and recovery tools</text><rect x='268' y='12' width='106' height='44' rx='12' class='c'/><text x='321' y='39' class='n y m'>Return to books</text><text x='18' y='100' class='n'>LLCBookKeepingPrivate</text><text x='18' y='132' class='h'>Native security proof</text><g class='n'><text x='18' y='156'>Synthetic records only. Run this screen in iOS and Android</text><text x='18' y='172'>development builds; Expo Go is not supported.</text></g><rect x='18' y='186' width='354' height='52' rx='12' fill='#F1F3EF'/><g class='n'><text x='30' y='208'>The browser preview cannot validate SQLCipher, platform</text><text x='30' y='224'>key storage, or device security.</text></g><rect x='18' y='252' width='354' height='186' rx='16' class='c'/><text x='34' y='282' class='s'>Encrypted local database</text><g class='n'><text x='34' y='306'>Creates a 32-byte random device key, stores it with</text><text x='34' y='322'>SecureStore, checks SQLCipher availability, writes a</text><text x='34' y='338'>synthetic record and attachment, reopens the database,</text><text x='34' y='354'>then verifies a wrong key fails.</text></g><rect x='34' y='372' width='322' height='48' rx='12' fill='#47765b'/><text x='195' y='402' class='m' fill='#fff' font-weight='700' font-size='15'>Run SQLCipher + key-storage proof</text><rect x='18' y='454' width='354' height='420' rx='16' class='c'/><text x='34' y='484' class='s'>Encrypted portable backup</text><g class='n'><text x='34' y='508'>AES-256-GCM, random 16-byte salt, 12-byte nonce,</text><text x='34' y='524'>PBKDF2-HMAC-SHA-256 at 600,000 iterations, and</text><text x='34' y='540'>authenticated format metadata. Restore builds and</text><text x='34' y='556'>validates a separate SQLCipher database with a new local</text><text x='34' y='572'>key, then switches an encrypted catalog pointer in a</text><text x='34' y='588'>durable SQLite transaction.</text></g></svg>
