<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844' viewBox='0 0 390 844' style='background:#F7F5F0'><style>svg{font-family:system-ui,sans-serif;font-size:13px;fill:#526174}.s{font-size:17px;font-weight:700;fill:#14243B}.r{font-size:14px;font-weight:600;fill:#14243B}.w{fill:#fff;font-size:15px;font-weight:700}.g{fill:#087A55;font-size:15px;font-weight:700}.y{fill:#087A55;font-weight:700}.n{font-size:12px}.m{text-anchor:middle}.c{fill:#fff;stroke:#D9E0DC}.b{fill:#fff;stroke:#087A55}.q{fill:#E7F3EC;stroke:#087A55}</style><rect width='390' height='84' fill='#fff'/><text x='18' y='42' class='s'>LLCBookKeepingPrivate</text><text x='18' y='64'>Northstar Studio LLC</text><rect x='290' y='20' width='82' height='44' rx='12' class='b'/><text x='331' y='47' class='g m'>Search</text><text x='18' y='120' class='s'>Guaranteed-payment obligations</text><text x='18' y='144' class='n'>Contracts and installments are memo-only. Unpaid</text><text x='18' y='160' class='n'>obligations do not post an expense, liability, or cash</text><text x='18' y='176' class='n'>movement. CPA review is needed for tax classification,</text><text x='18' y='192' class='n'>deductibility, and capitalization.</text><text x='18' y='224' class='r'>Guaranteed payment classification</text><rect x='18' y='232' width='100' height='44' rx='22' class='q'/><text x='68' y='259' class='y m'>Services</text><rect x='126' y='232' width='124' height='44' rx='22' class='c'/><text x='188' y='259' class='m'>Use of capital</text><rect x='18' y='292' width='354' height='48' rx='12' fill='#087A55'/><text x='195' y='322' class='w m'>Save obligation and installments</text><text x='18' y='372' class='s'>Outstanding</text><text x='320' y='372' class='r'>$0.00</text><text x='18' y='420' class='s'>Record an actual member payment</text><text x='18' y='444' class='n'>Only cash actually paid posts an expense. Allocate the</text><text x='18' y='460' class='n'>payment to one or more installments; partial allocations</text><text x='18' y='476' class='n'>are allowed.</text><rect y='784' width='390' height='60' fill='#fff'/><rect x='157' y='790' width='76' height='48' rx='12' fill='#E7F3EC'/><text y='819' class='n m'><tspan x='39'>Dashboard</tspan><tspan x='117'>Transactions</tspan><tspan x='195' fill='#087A55' font-weight='700'>Members</tspan><tspan x='273'>Reports</tspan><tspan x='351'>More</tspan></text></svg>
