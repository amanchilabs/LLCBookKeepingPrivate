appId: com.amanchilabs.llcbookkeepingprivate
---
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- scrollUntilVisible:
    element: "Get started"
    direction: DOWN
    timeout: 15000
- tapOn: "Get started"
- scrollUntilVisible:
